<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logga in – PDF-ändraren</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { --bg: #f6f4ef; --card: #fff; --ink: #1f2a24; --muted: #5d6a63; --accent: #2f6b4f; --accent-ink: #fff; --line: #ddd8cc; --bad: #a23b2a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
      main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      p { margin: 0 0 24px; color: var(--muted); }
      label { display: block; font-weight: 600; margin-bottom: 8px; }
      input { width: 100%; font: inherit; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
      input:focus { outline: 3px solid #b9d6c6; border-color: var(--accent); }
      button { margin-top: 20px; width: 100%; font: inherit; font-weight: 600; padding: 14px; border: 0; border-radius: 10px;
        background: var(--accent); color: var(--accent-ink); cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      .err { color: var(--bad); margin-top: 14px; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>PDF-ändraren</h1>
      <p>Skriv lösenordet för att fortsätta.</p>
      <form id="f">
        <label for="pw">Lösenord</label>
        <input id="pw" type="password" autocomplete="current-password" required autofocus />
        <button id="b" type="submit">Logga in</button>
        <div class="err" id="e" role="alert"></div>
      </form>
    </main>
    <script>
      const f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e');
      f.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        b.disabled = true; b.textContent = 'Loggar in…'; e.textContent = '';
        try {
          const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('pw').value }) });
          const j = await r.json().catch(() => ({}));
          if (r.ok) { location.href = '/'; return; }
          e.textContent = j.error || 'Det gick inte att logga in. Försök igen.';
        } catch { e.textContent = 'Ingen kontakt med servern. Kontrollera internet och försök igen.'; }
        b.disabled = false; b.textContent = 'Logga in';
      });
    </script>
  </body>
</html>
